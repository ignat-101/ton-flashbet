<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://telegram.org https://ton-connect.github.io; script-src 'self' https://telegram.org https://ton-connect.github.io 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.coingecko.com https://toncenter.com;">
    <title>TON FlashBet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://ton-connect.github.io/sdk/tonconnect-sdk.min.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d29922;
            --border: #30363d;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Fixed Header with Prices */
        .price-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 100;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        
        .price-header::-webkit-scrollbar {
            display: none;
        }
        
        .price-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .price-item:hover {
            background: var(--border);
        }
        
        .price-item .symbol {
            font-size: 0.75em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .price-item .price {
            font-size: 0.9em;
            font-weight: bold;
            margin: 2px 0;
        }
        
        .price-item .change {
            font-size: 0.75em;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        
        .change.up { color: var(--success); }
        .change.down { color: var(--danger); }
        .change.fire { font-size: 0.9em; }
        
        /* Main Content */
        .main-content {
            margin-top: 80px;
            margin-bottom: 70px;
            padding: 16px;
        }
        
        /* Tabs */
        .tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 0.85em;
            font-family: inherit;
        }
        
        .tab:hover {
            background: var(--bg-tertiary);
        }
        
        .tab.active {
            color: var(--accent);
            border-top: 2px solid var(--accent);
        }
        
        .tab-icon {
            font-size: 1.2em;
            display: block;
            margin-bottom: 4px;
        }
        
        /* Tab Content */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Cards */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        /* Bet Card */
        .bet-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .bet-condition {
            font-weight: 500;
            flex: 1;
            margin-right: 12px;
        }
        
        .bet-amount {
            color: var(--accent);
            font-weight: bold;
            white-space: nowrap;
        }
        
        .bet-probability {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }
        
        .probability-bar {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .probability-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }
        
        .probability-text {
            font-size: 0.9em;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }
        
        /* Buttons */
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            font-family: inherit;
        }
        
        .btn:hover {
            background: var(--accent-hover);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 0.85em;
            width: auto;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95em;
            font-family: inherit;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }
        
        /* Wallet Connection */
        .wallet-info {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .wallet-address {
            font-family: monospace;
            font-size: 0.85em;
            color: var(--text-secondary);
            word-break: break-all;
            margin: 8px 0;
        }
        
        .wallet-balance {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent);
            margin: 8px 0;
        }
        
        /* Trade Interface */
        .trade-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        
        .trade-slider {
            width: 100%;
            margin: 12px 0;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            outline: none;
        }
        
        .trade-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        
        .trade-amount-display {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin: 8px 0;
        }
        
        /* Status Badges */
        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }
        
        .status.active { background: rgba(63, 185, 80, 0.2); color: var(--success); }
        .status.pending { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
        .status.completed { background: rgba(88, 166, 255, 0.2); color: var(--accent); }
        .status.disputed { background: rgba(248, 81, 73, 0.2); color: var(--danger); }
        
        /* Loading & Messages */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .message {
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 0.9em;
        }
        
        .message.success {
            background: rgba(63, 185, 80, 0.1);
            color: var(--success);
            border: 1px solid rgba(63, 185, 80, 0.3);
        }
        
        .message.error {
            background: rgba(248, 81, 73, 0.1);
            color: var(--danger);
            border: 1px solid rgba(248, 81, 73, 0.3);
        }
        
        /* Quick Bet Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        /* Referral Link */
        .referral-link {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 12px 0;
        }
        
        .referral-link input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85em;
        }
        
        /* Transaction History */
        .tx-item {
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        
        .tx-hash {
            font-family: monospace;
            color: var(--accent);
            font-size: 0.85em;
        }
        
        /* Oracle Status */
        .oracle-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            margin-top: 8px;
            font-size: 0.85em;
        }
        
        .oracle-checking {
            color: var(--warning);
        }
        
        .oracle-success {
            color: var(--success);
        }
        
        .oracle-failed {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <!-- Fixed Price Header -->
    <div class="price-header" id="priceHeader">
        <div class="price-item" onclick="quickBet('bitcoin')">
            <span class="symbol">BTC</span>
            <span class="price" id="btc-price">--</span>
            <span class="change" id="btc-change">--</span>
        </div>
        <div class="price-item" onclick="quickBet('ethereum')">
            <span class="symbol">ETH</span>
            <span class="price" id="eth-price">--</span>
            <span class="change" id="eth-change">--</span>
        </div>
        <div class="price-item" onclick="quickBet('solana')">
            <span class="symbol">SOL</span>
            <span class="price" id="sol-price">--</span>
            <span class="change" id="sol-change">--</span>
        </div>
        <div class="price-item" onclick="quickBet('ton')">
            <span class="symbol">TON</span>
            <span class="price" id="ton-price">--</span>
            <span class="change" id="ton-change">--</span>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Bets Tab -->
        <div class="tab-content active" id="betsTab">
            <div id="betsList">
                <div class="loading">Загрузка ставок...</div>
            </div>
        </div>
        
        <!-- Create Bet Tab -->
        <div class="tab-content" id="createTab">
            <div class="card">
                <h2 style="margin-bottom: 16px;">Создать ставку</h2>
                <div class="form-group">
                    <label class="form-label">Условие ставки</label>
                    <textarea class="form-input" id="betCondition" placeholder="Например: BTC превысит $100,000 до конца недели" maxlength="500"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Сумма (TON)</label>
                    <input type="number" class="form-input" id="betAmount" placeholder="0.1" step="0.1" min="0.1" max="1000">
                </div>
                <div class="form-group">
                    <label class="form-label">Оппонент (необязательно)</label>
                    <input type="text" class="form-input" id="opponentTag" placeholder="@username">
                </div>
                <button class="btn" onclick="createBet()" id="createBetBtn">Создать ставку</button>
                <div id="createBetMessage"></div>
            </div>
        </div>
        
        <!-- Profile Tab -->
        <div class="tab-content" id="profileTab">
            <div class="wallet-info" id="walletSection">
                <h3>Кошелек TON</h3>
                <div id="walletNotConnected">
                    <p style="color: var(--text-secondary); margin: 12px 0;">Подключите кошелек для ставок</p>
                    <button class="btn btn-secondary" onclick="connectWallet()" id="connectWalletBtn">Подключить кошелек</button>
                </div>
                <div id="walletConnected" style="display: none;">
                    <div class="wallet-balance" id="walletBalance">0 TON</div>
                    <div class="wallet-address" id="walletAddress">--</div>
                    <button class="btn btn-secondary btn-small" onclick="disconnectWallet()" style="margin-top: 12px;">Отключить</button>
                </div>
            </div>
            
            <div class="card">
                <h3>Профиль</h3>
                <div id="profileInfo" class="loading">Загрузка...</div>
            </div>
            
            <div class="card">
                <h3>Реферальная ссылка</h3>
                <div id="referralSection" class="loading">Загрузка...</div>
            </div>
            
            <div class="card">
                <h3>История транзакций</h3>
                <div id="txHistory" class="loading">Загрузка...</div>
            </div>
        </div>
    </div>
    
    <!-- Quick Bet Modal -->
    <div class="modal" id="quickBetModal">
        <div class="modal-content">
            <div class="modal-title">Быстрая ставка</div>
            <div id="quickBetCrypto" style="font-size: 1.1em; margin-bottom: 16px;"></div>
            <div class="form-group">
                <label class="form-label">Направление</label>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary btn-small" style="flex: 1;" onclick="setQuickBetDirection('up')">📈 Рост</button>
                    <button class="btn btn-secondary btn-small style="flex: 1;" onclick="setQuickBetDirection('down')">📉 Падение</button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Сумма (TON)</label>
                <input type="number" class="form-input" id="quickBetAmount" placeholder="0.1" step="0.1" min="0.1">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button class="btn btn-secondary" style="flex: 1;" onclick="closeQuickBetModal()">Отмена</button>
                <button class="btn" style="flex: 1;" onclick="placeQuickBet()">Ставка</button>
            </div>
        </div>
    </div>
    
    <!-- Bottom Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('bets')">
            <span class="tab-icon">🎲</span>
            Ставки
        </button>
        <button class="tab" onclick="switchTab('create')">
            <span class="tab-icon">➕</span>
            Создать
        </button>
        <button class="tab" onclick="switchTab('profile')">
            <span class="tab-icon">👤</span>
            Профиль
        </button>
    </div>
    
    <script>
        // Global state
        let userId = null;
        let username = null;
        let initData = null;
        let tonConnector = null;
        let walletAddress = null;
        let currentQuickBetCrypto = null;
        let currentQuickBetDirection = null;
        
        // Initialize Telegram WebApp
        function initTelegram() {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                initData = Telegram.WebApp.initData;
                
                const user = Telegram.WebApp.initDataUnsafe.user;
                if (user) {
                    userId = user.id;
                    username = user.username || '';
                }
                
                // Apply Telegram theme
                if (Telegram.WebApp.colorScheme === 'dark') {
                    document.body.style.background = '#0d1117';
                }
            }
        }
        
        // Initialize TON Connect
        function initTONConnect() {
            try {
                if (window.TONConnect) {
                    tonConnector = new window.TONConnect.TONConnect({
                        manifestUrl: window.location.origin + '/tonconnect-manifest.json'
                    });
                    
                    tonConnector.onStatusChange((wallet) => {
                        if (wallet) {
                            walletAddress = wallet.account.address;
                            onWalletConnected(wallet);
                        } else {
                            onWalletDisconnected();
                        }
                    });
                    
                    // Check if already connected
                    if (tonConnector.wallet) {
                        walletAddress = tonConnector.wallet.account.address;
                        onWalletConnected(tonConnector.wallet);
                    }
                }
            } catch (error) {
                console.error('TON Connect init error:', error);
            }
        }
        
        // API Request helper
        async function apiRequest(url, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (initData) {
                headers['X-Telegram-Init-Data'] = initData;
            }
            
            const response = await fetch(url, {
                ...options,
                headers: headers
            });
            
            if (response.status === 401) {
                throw new Error('Ошибка авторизации');
            }
            
            return response;
        }
        
        // Load prices
        async function loadPrices() {
            try {
                const response = await apiRequest('/api/prices');
                const prices = await response.json();
                
                const cryptos = [
                    { id: 'bitcoin', symbol: 'btc' },
                    { id: 'ethereum', symbol: 'eth' },
                    { id: 'solana', symbol: 'sol' },
                    { id: 'ton', symbol: 'ton' }
                ];
                
                cryptos.forEach(crypto => {
                    const data = prices[crypto.id];
                    if (data) {
                        const priceEl = document.getElementById(`${crypto.symbol}-price`);
                        const changeEl = document.getElementById(`${crypto.symbol}-change`);
                        
                        if (priceEl) {
                            priceEl.textContent = `$${data.price.toLocaleString()}`;
                        }
                        
                        if (changeEl) {
                            const change = data.change_percent || 0;
                            const isUp = data.direction === 'up';
                            const hasFire = Math.abs(change) > 0.1;
                            
                            changeEl.className = `change ${isUp ? 'up' : 'down'}`;
                            changeEl.innerHTML = `
                                ${isUp ? '↑' : '↓'} ${Math.abs(change).toFixed(2)}%
                                ${hasFire ? '<span class="fire">🔥</span>' : ''}
                            `;
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading prices:', error);
            }
        }
        
        // Tab switching
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.closest('.tab').classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}Tab`).classList.add('active');
            
            // Load data for specific tabs
            if (tabName === 'bets') {
                loadBets();
            } else if (tabName === 'profile') {
                loadProfile();
            }
        }
        
        // Load bets
        async function loadBets() {
            try {
                const response = await apiRequest('/api/bets');
                const bets = await response.json();
                
                const betsList = document.getElementById('betsList');
                if (bets.length === 0) {
                    betsList.innerHTML = '<div class="loading">Нет активных ставок</div>';
                    return;
                }
                
                betsList.innerHTML = '';
                bets.forEach(bet => {
                    const betCard = createBetCard(bet);
                    betsList.appendChild(betCard);
                });
            } catch (error) {
                console.error('Error loading bets:', error);
                document.getElementById('betsList').innerHTML = 
                    '<div class="message error">Ошибка загрузки ставок</div>';
            }
        }
        
        // Create bet card element
        function createBetCard(bet) {
            const div = document.createElement('div');
            div.className = 'bet-card';
            
            const probability = bet.market_probability || bet.probability || 50;
            const statusClass = bet.status === 'active' ? 'active' : 
                              bet.status === 'pending' ? 'pending' : 
                              bet.status === 'disputed' ? 'disputed' : 'completed';
            
            div.innerHTML = `
                <div class="bet-header">
                    <div class="bet-condition">${escapeHtml(bet.condition)}</div>
                    <div class="bet-amount">${bet.amount} TON</div>
                </div>
                <div class="bet-probability">
                    <span>Вероятность:</span>
                    <div class="probability-bar">
                        <div class="probability-fill" style="width: ${probability}%"></div>
                    </div>
                    <span class="probability-text">${probability.toFixed(1)}%</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="status ${statusClass}">${bet.status}</span>
                    <button class="btn btn-small" onclick="showTradeInterface('${bet.id}')">Торговать</button>
                </div>
                ${bet.oracle_status ? `
                    <div class="oracle-status oracle-${bet.oracle_status}">
                        🔮 Оракул: ${bet.oracle_status === 'checking' ? 'Проверка...' : 
                                    bet.oracle_status === 'success' ? 'Условие выполнено ✓' : 
                                    'Ожидание'}
                    </div>
                ` : ''}
                <div class="trade-section" id="trade-${bet.id}" style="display: none;">
                    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                        <button class="btn btn-secondary btn-small" style="flex: 1;" onclick="setTradeSide('${bet.id}', 'yes')">YES</button>
                        <button class="btn btn-secondary btn-small" style="flex: 1;" onclick="setTradeSide('${bet.id}', 'no')">NO</button>
                    </div>
                    <input type="range" class="trade-slider" id="slider-${bet.id}" min="0.1" max="${bet.amount}" step="0.1" value="0.1" oninput="updateTradeAmount('${bet.id}')">
                    <div class="trade-amount-display" id="trade-amount-${bet.id}">0.1 TON</div>
                    <button class="btn" onclick="placeTrade('${bet.id}')">Купить</button>
                </div>
            `;
            
            return div;
        }
        
        // Trade interface
        function showTradeInterface(betId) {
            const tradeSection = document.getElementById(`trade-${betId}`);
            if (tradeSection.style.display === 'none') {
                tradeSection.style.display = 'block';
            } else {
                tradeSection.style.display = 'none';
            }
        }
        
        function setTradeSide(betId, side) {
            // Update UI to show selected side
            console.log(`Trade side for ${betId}: ${side}`);
        }
        
        function updateTradeAmount(betId) {
            const slider = document.getElementById(`slider-${betId}`);
            const display = document.getElementById(`trade-amount-${betId}`);
            display.textContent = `${slider.value} TON`;
        }
        
        async function placeTrade(betId) {
            const slider = document.getElementById(`slider-${betId}`);
            const amount = parseFloat(slider.value);
            
            if (!walletAddress) {
                showMessage('Требуется подключить кошелек', 'error');
                return;
            }
            
            try {
                const response = await apiRequest('/api/trade', {
                    method: 'POST',
                    body: JSON.stringify({
                        bet_id: betId,
                        amount: amount,
                        side: 'yes' // Should get from UI
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    showMessage('Торговая операция выполнена!', 'success');
                } else {
                    showMessage('Ошибка: ' + (result.error || 'Unknown'), 'error');
                }
            } catch (error) {
                showMessage('Ошибка торговли: ' + error.message, 'error');
            }
        }
        
        // Create bet
        async function createBet() {
            if (!userId) {
                showMessage('Ошибка: не удалось получить данные пользователя', 'error', 'createBetMessage');
                return;
            }
            
            const amount = document.getElementById('betAmount').value;
            const opponent = document.getElementById('opponentTag').value;
            const condition = document.getElementById('betCondition').value;
            
            if (!amount || !condition) {
                showMessage('Заполните все поля', 'error', 'createBetMessage');
                return;
            }
            
            const btn = document.getElementById('createBetBtn');
            btn.disabled = true;
            btn.textContent = 'Создание...';
            
            try {
                const response = await apiRequest('/api/bets/create', {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: userId,
                        amount: amount,
                        opponent_tag: opponent,
                        condition: condition
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    showMessage('Ставка создана! ID: ' + result.bet_id, 'success', 'createBetMessage');
                    document.getElementById('betAmount').value = '';
                    document.getElementById('opponentTag').value = '';
                    document.getElementById('betCondition').value = '';
                    switchTab('bets');
                } else {
                    showMessage('Ошибка: ' + (result.error || 'Unknown'), 'error', 'createBetMessage');
                }
            } catch (error) {
                showMessage('Ошибка создания: ' + error.message, 'error', 'createBetMessage');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Создать ставку';
            }
        }
        
        // Quick bet from price header
        function quickBet(cryptoId) {
            currentQuickBetCrypto = cryptoId;
            const modal = document.getElementById('quickBetModal');
            const cryptoDiv = document.getElementById('quickBetCrypto');
            cryptoDiv.textContent = `Ставка на ${cryptoId.toUpperCase()}`;
            modal.classList.add('active');
        }
        
        function closeQuickBetModal() {
            document.getElementById('quickBetModal').classList.remove('active');
        }
        
        function setQuickBetDirection(direction) {
            currentQuickBetDirection = direction;
            // Update UI
        }
        
        async function placeQuickBet() {
            const amount = document.getElementById('quickBetAmount').value;
            if (!amount || !currentQuickBetCrypto || !currentQuickBetDirection) {
                return;
            }
            
            // Create bet with condition based on direction
            const condition = `${currentQuickBetCrypto.toUpperCase()} ${currentQuickBetDirection === 'up' ? 'вырастет' : 'упадет'} через 5 минут`;
            
            try {
                const response = await apiRequest('/api/bets/create', {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: userId,
                        amount: amount,
                        condition: condition
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    closeQuickBetModal();
                    showMessage('Быстрая ставка создана!', 'success');
                    switchTab('bets');
                }
            } catch (error) {
                showMessage('Ошибка: ' + error.message, 'error');
            }
        }
        
        // Wallet connection
        async function connectWallet() {
            if (!tonConnector) {
                showMessage('TON Connect не инициализирован', 'error');
                return;
            }
            
            try {
                await tonConnector.connect();
            } catch (error) {
                console.error('Wallet connection error:', error);
                showMessage('Ошибка подключения кошелька', 'error');
            }
        }
        
        function onWalletConnected(wallet) {
            document.getElementById('walletNotConnected').style.display = 'none';
            document.getElementById('walletConnected').style.display = 'block';
            document.getElementById('walletAddress').textContent = wallet.account.address;
            
            // Load balance
            loadWalletBalance();
        }
        
        function onWalletDisconnected() {
            document.getElementById('walletNotConnected').style.display = 'block';
            document.getElementById('walletConnected').style.display = 'none';
            walletAddress = null;
        }
        
        async function disconnectWallet() {
            if (tonConnector) {
                await tonConnector.disconnect();
            }
        }
        
        async function loadWalletBalance() {
            if (!walletAddress) return;
            
            try {
                const response = await apiRequest(`/api/wallet/balance?address=${walletAddress}`);
                const data = await response.json();
                document.getElementById('walletBalance').textContent = `${data.balance || 0} TON`;
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }
        
        // Load profile
        async function loadProfile() {
            if (!userId) return;
            
            try {
                const response = await apiRequest(`/api/profile?user_id=${userId}`);
                const data = await response.json();
                
                const profileInfo = document.getElementById('profileInfo');
                profileInfo.innerHTML = `
                    <p><strong>ID:</strong> ${userId}</p>
                    <p><strong>Username:</strong> ${username || 'Не указан'}</p>
                    <p><strong>Репутация:</strong> ${data.user?.reputation || 100}</p>
                    <p><strong>Заработано:</strong> ${data.user?.total_earned || 0} TON</p>
                `;
                
                // Load referral info
                const refResponse = await apiRequest(`/api/referral/generate?user_id=${userId}`);
                const refData = await refResponse.json();
                
                document.getElementById('referralSection').innerHTML = `
                    <div class="referral-link">
                        <input type="text" value="${refData.link || ''}" readonly id="refLinkInput">
                        <button class="btn btn-small" onclick="copyRefLink()">Копировать</button>
                    </div>
                `;
                
                // Load treasury/transaction info
                const treasuryResponse = await apiRequest('/api/treasury');
                const treasuryData = await treasuryResponse.json();
                
                const txHistory = document.getElementById('txHistory');
                if (treasuryData.recent_transactions && treasuryData.recent_transactions.length > 0) {
                    txHistory.innerHTML = treasuryData.recent_transactions.map(tx => `
                        <div class="tx-item">
                            <div>${tx.type} - ${tx.amount} TON</div>
                            <div style="color: var(--text-secondary); font-size: 0.85em;">${new Date(tx.timestamp * 1000).toLocaleString()}</div>
                        </div>
                    `).join('');
                } else {
                    txHistory.innerHTML = '<p style="color: var(--text-secondary);">Нет транзакций</p>';
                }
                
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('profileInfo').innerHTML = 
                    '<div class="message error">Ошибка загрузки профиля</div>';
            }
        }
        
        function copyRefLink() {
            const input = document.getElementById('refLinkInput');
            input.select();
            document.execCommand('copy');
            showMessage('Ссылка скопирована!', 'success');
        }
        
        // Helper functions
        function showMessage(text, type, elementId = null) {
            const msgDiv = elementId ? document.getElementById(elementId) : createMessageElement();
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            
            if (!elementId) {
                document.querySelector('.main-content').prepend(msgDiv);
            }
            
            setTimeout(() => {
                msgDiv.remove();
            }, 5000);
        }
        
        function createMessageElement() {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '80px';
            div.style.left = '16px';
            div.style.right = '16px';
            div.style.zIndex = '1000';
            return div;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initialize
        initTelegram();
        initTONConnect();
        
        // Load initial data
        loadPrices();
        loadBets();
        
        // Auto-refresh prices every 30 seconds
        setInterval(loadPrices, 30000);
    </script>
</body>
</html>

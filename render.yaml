services:
  - type: web
    name: ton-flashbet
    env: python
    plan: free
    buildCommand: "chmod +x run.sh && pip install -r requirements.txt"
    startCommand: "bash run.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: BOT_TOKEN
        sync: false  # Нужно добавить в Render Dashboard!
      - key: BOT_WALLET_ADDRESS
        sync: false
      - key: TON_API_ENDPOINT
        value: "https://toncenter.com/api/v2/jsonRPC"
      - key: BOT_USERNAME
        value: "FlashBetTON_bot"
      - key: TMA_URL
        sync: false  # Укажи URL после деплоя, например https://ton-flashbet.onrender.com/
      - key: FLASK_SECRET
        value: "CHANGE_THIS_RANDOM_SECRET"
      - key: DEBUG
        value: "false"

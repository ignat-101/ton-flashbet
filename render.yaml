services:
  - type: web
    name: ton-flashbet
    env: python
    plan: free
    buildCommand: "chmod +x run.sh && pip install -r requirements.txt"
    startCommand: "bash run.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: BOT_TOKEN
        value: "YOUR_BOT_TOKEN_HERE"  # Заменить в Render Dashboard
      - key: BOT_WALLET_ADDRESS
        value: "YOUR_WALLET_ADDRESS_HERE"  # Заменить в Render Dashboard
      - key: TON_API_ENDPOINT
        value: "https://toncenter.com/api/v2/jsonRPC"
      - key: BOT_USERNAME
        value: "FlashBetTON_bot"
      - key: TMA_URL
        value: "https://ton-flashbet.onrender.com/"  # Будет доступно после деплоя
      - key: FLASK_SECRET
        value: "CHANGE_THIS_RANDOM_SECRET"
      - key: DEBUG
        value: "false"
